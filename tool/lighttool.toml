[tool]
id = "com.kezo.tide"
label = "Tide"
versionCode = 47
versionName = "3.3"
permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"]
# Official SDK background audio: playback keeps going / auto-advancing while Tide
# is backgrounded, via the SDK's detached MediaSessionService. The plugin adds
# the foreground-service permissions + service declaration for you.
capabilities = ["detached-audio"]
# use "com.thelightphone.sdk.emulator" when running on the LightOS emulator
serverPackage = "com.lightos"
