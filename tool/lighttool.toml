[tool]
id = "com.kezo.tide"
label = "Tide"
versionCode = 44
versionName = "3.0"
permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"]
# Run the SDK foreground media service so playback keeps going / auto-advancing
# while Tide is backgrounded. Adds the foreground-service permissions for you.
backgroundAudio = true
# use "com.thelightphone.sdk.emulator" when running on the LightOS emulator
serverPackage = "com.lightos"
