name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        env:
          # Light hosts its keyboard library on GitHub Packages. The workflow
          # token works if it can read public packages; otherwise add a classic
          # PAT with read:packages as the GH_PACKAGES_TOKEN repo secret.
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN != '' && secrets.GH_PACKAGES_TOKEN || github.token }}
        run: ./gradlew --no-daemon :tool:assembleDebug :tool:assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp tool/build/outputs/apk/release/*.apk dist/tide-release.apk
          cp tool/build/outputs/apk/debug/*.apk dist/tide-debug.apk
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tide-apks
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
